<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lector Facturas PY</title>
    
    <!-- Icono oficial para la pantalla de inicio del iPhone -->
    <link rel="apple-touch-icon" href="logo.png">
    <link rel="apple-touch-icon-precomposed" href="logo.png">

    <!-- Redirección automática segura tras 1 segundo (Evita bloqueos de Safari) -->
    <meta http-equiv="refresh" content="1; url=https://onrender.com">

    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            color: #333;
        }
        .loader-box {
            text-align: center;
            padding: 20px;
        }
        .spinner {
            border: 4px solid rgba(0, 0, 0, 0.1);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border-left-color: #004a99;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="loader-box">
        <div class="spinner"></div>
        <h2>Lector de Facturas PY</h2>
        <p>Abriendo aplicación contable...</p>
    </div>
</body>
</html>
